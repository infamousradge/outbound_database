name: Build Windows Release

on:
  push:
    branches: [ main, 'release/**' ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform (if missing)
        run: flutter create --platforms=windows .

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip release
        shell: pwsh
        run: |
          $out = 'outbound_database_windows.zip'
          if (Test-Path $out) { Remove-Item $out }
          Compress-Archive -Path build\windows\runner\Release\* -DestinationPath $out
          Write-Host "Created $out"

      - name: Install NSIS (Chocolatey)
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\\NSIS\\makensis.exe"
          if (-not (Test-Path $nsis)) { Write-Host "makensis not found at $nsis"; exit 1 }
          & $nsis -V2 installer.nsi
          if (-not (Test-Path .\\outbound_database_installer.exe)) { Write-Host "Installer not created"; exit 1 }
          Write-Host "Created installer outbound_database_installer.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: outbound_database-windows
          path: |
            outbound_database_windows.zip
            outbound_database_installer.exe
