name: Build Windows Release

on:
  push:
    branches: [ main, 'release/**' ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Run quick static analysis (smoke)
        run: flutter analyze --no-fatal-infos || flutter analyze

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform (if missing)
        run: flutter create --platforms=windows .

      - name: Build Windows release (capture log)
        shell: pwsh
        run: |
          $log = 'build_windows_log.txt'
          if (Test-Path $log) { Remove-Item $log }
          Write-Host "Starting flutter build (logs -> $log)"
          flutter build windows --release 2>&1 | Tee-Object -FilePath $log
          if (-not (Test-Path 'build\\windows\\runner\\Release')) {
            Write-Host "Build output not found at build\\windows\\runner\\Release"
            Write-Host "Tail of build log:"; Get-Content $log -Tail 200 | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - name: Zip release (if build exists)
        shell: pwsh
        run: |
          $out = 'outbound_database_windows.zip'
          $buildPath = 'build\windows\runner\Release'
          if (-not (Test-Path $buildPath)) {
            Write-Host "Build output not found at $buildPath"
            Write-Host "Listing build/ directory for debugging:"
            Get-ChildItem -Recurse -Force build | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          if (Test-Path $out) { Remove-Item $out }
          Compress-Archive -Path (Join-Path $buildPath '*') -DestinationPath $out
          Write-Host "Created $out"

      - name: Install NSIS (Chocolatey)
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\\NSIS\\makensis.exe"
          if (-not (Test-Path $nsis)) { Write-Host "makensis not found at $nsis"; exit 1 }
          & $nsis -V2 installer.nsi
          if (-not (Test-Path .\\outbound_database_installer.exe)) { Write-Host "Installer not created"; exit 1 }
          Write-Host "Created installer outbound_database_installer.exe"

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outbound_database-windows
          path: |
            outbound_database_windows.zip
            outbound_database_installer.exe
            build_windows_log.txt
