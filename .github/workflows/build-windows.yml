name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: outbound-database-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 Build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter --version
          dart --version
          flutter doctor -v

      - name: Enable Windows desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop

      - name: Ensure Windows platform exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path 'windows/CMakeLists.txt')) {
            Write-Host 'Generating Windows platform files...'
            flutter create --platforms=windows --project-name=outbound_database --no-pub .
            if ($LASTEXITCODE -ne 0) {
              throw "flutter create failed with exit code $LASTEXITCODE"
            }
          } else {
            Write-Host 'Windows platform files already exist.'
          }

          if (-not (Test-Path 'windows/CMakeLists.txt')) {
            throw 'windows/CMakeLists.txt was not generated.'
          }

      - name: Install Dart and Flutter dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          if ($LASTEXITCODE -ne 0) {
            throw "flutter pub get failed with exit code $LASTEXITCODE"
          }

      - name: Run analyzer (non-blocking for lints)
        shell: pwsh
        run: |
          $log = Join-Path $PWD 'analyze_log.txt'

          Write-Host 'Running Flutter analyzer.'
          Write-Host 'Info/lint diagnostics are intentionally not allowed to block the release build.'

          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 |
            Tee-Object -FilePath $log

          $code = $LASTEXITCODE

          if ($code -ne 0) {
            Write-Warning "flutter analyze returned exit code $code. The Windows compiler will be the release gate."
          } else {
            Write-Host 'Analyzer completed successfully.'
          }

      - name: Clean previous Flutter outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter clean
          if ($LASTEXITCODE -ne 0) {
            throw "flutter clean failed with exit code $LASTEXITCODE"
          }
          flutter pub get
          if ($LASTEXITCODE -ne 0) {
            throw "flutter pub get after clean failed with exit code $LASTEXITCODE"
          }

      - name: Build Windows x64 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $log = Join-Path $PWD 'build_windows_log.txt'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          Write-Host '============================================='
          Write-Host 'BUILDING FLUTTER WINDOWS RELEASE'
          Write-Host '============================================='

          flutter build windows --release --verbose 2>&1 |
            Tee-Object -FilePath $log

          $code = $LASTEXITCODE

          if ($code -ne 0) {
            Write-Host ''
            Write-Host 'Flutter Windows build failed.'
            Write-Host 'Last 200 lines of build log:'
            if (Test-Path $log) {
              Get-Content $log -Tail 200
            }
            exit $code
          }

          Write-Host ''
          Write-Host 'Flutter Windows build command succeeded.'

      - name: Locate and verify Flutter release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Get-ChildItem `
            -Path 'build/windows' `
            -Filter 'outbound_database.exe' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\Release\\outbound_database\.exe$' } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host 'Flutter reported success but the executable was not found.'
            Write-Host 'Actual build/windows tree:'
            if (Test-Path 'build/windows') {
              Get-ChildItem 'build/windows' -Recurse -Force |
                Select-Object FullName, Length |
                Format-Table -AutoSize
            }
            throw 'outbound_database.exe was not found under a Release directory.'
          }

          $releaseDir = $exe.Directory.FullName

          Write-Host ''
          Write-Host '============================================='
          Write-Host 'WINDOWS RELEASE FOUND'
          Write-Host "EXE: $($exe.FullName)"
          Write-Host "RELEASE DIR: $releaseDir"
          Write-Host "SIZE: $([math]::Round($exe.Length / 1MB, 2)) MB"
          Write-Host '============================================='

          "RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $required = @(
            'outbound_database.exe'
          )

          foreach ($name in $required) {
            $path = Join-Path $releaseDir $name
            if (-not (Test-Path $path)) {
              throw "Required release file missing: $path"
            }
          }

          Write-Host ''
          Write-Host 'Complete release bundle:'
          Get-ChildItem $releaseDir -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Prepare distribution folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($path in @('dist', 'installer_payload')) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

          Copy-Item "$env:RELEASE_DIR/*" 'installer_payload' -Recurse -Force

          if (-not (Test-Path 'installer_payload/outbound_database.exe')) {
            throw 'Installer payload was not created correctly.'
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Join-Path $PWD 'dist/OutboundDatabase-Windows-Portable.zip'

          Compress-Archive `
            -Path "$env:RELEASE_DIR/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path $zip)) {
            throw 'Portable ZIP was not created.'
          }

          Write-Host 'Portable ZIP:'
          Get-Item $zip | Format-List FullName, Length, LastWriteTime

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installation failed with exit code $LASTEXITCODE"
          }

          $makensis = @(
            "$env:ProgramFiles(x86)\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $makensis) {
            throw 'NSIS makensis.exe was not found.'
          }

          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "NSIS: $makensis"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & $env:MAKENSIS /V3 'installer.nsi'
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            throw "NSIS build failed with exit code $code"
          }

          if (-not (Test-Path 'OutboundDatabase-Setup.exe')) {
            throw 'OutboundDatabase-Setup.exe was not created.'
          }

          Write-Host 'Installer:'
          Get-Item 'OutboundDatabase-Setup.exe' |
            Format-List FullName, Length, LastWriteTime

      - name: Create build manifest
        if: always()
        shell: pwsh
        run: |
          $manifest = @()
          $manifest += 'Outbound Database Windows Build'
          $manifest += '================================'
          $manifest += "Repository: $env:GITHUB_REPOSITORY"
          $manifest += "Ref: $env:GITHUB_REF"
          $manifest += "Commit: $env:GITHUB_SHA"
          $manifest += "Runner OS: $env:RUNNER_OS"
          $manifest += ''
          $manifest += 'Flutter version:'
          $manifest += (flutter --version | Out-String).TrimEnd()
          $manifest += ''
          $manifest += "Release directory: $env:RELEASE_DIR"
          $manifest += ''

          if (Test-Path 'dist/OutboundDatabase-Windows-Portable.zip') {
            $f = Get-Item 'dist/OutboundDatabase-Windows-Portable.zip'
            $manifest += "Portable ZIP: $($f.FullName) [$($f.Length) bytes]"
          }

          if (Test-Path 'OutboundDatabase-Setup.exe') {
            $f = Get-Item 'OutboundDatabase-Setup.exe'
            $manifest += "Installer: $($f.FullName) [$($f.Length) bytes]"
          }

          $manifest | Set-Content 'build_manifest.txt' -Encoding utf8

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outbound-database-windows
          if-no-files-found: warn
          path: |
            dist/OutboundDatabase-Windows-Portable.zip
            OutboundDatabase-Setup.exe
            analyze_log.txt
            build_windows_log.txt
            build_manifest.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/OutboundDatabase-Windows-Portable.zip
            OutboundDatabase-Setup.exe
