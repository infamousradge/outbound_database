name: Build Windows Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outbound-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        shell: pwsh
        run: flutter doctor -v

      - name: Generate Windows platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop
          if (-not (Test-Path 'windows\CMakeLists.txt')) {
            flutter create --platforms=windows --project-name=outbound_database --no-pub .
            if ($LASTEXITCODE -ne 0) { throw 'flutter create failed.' }
          }
          if (-not (Test-Path 'windows\CMakeLists.txt')) { throw 'Windows platform files were not generated.' }

      - name: Pub get
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'flutter pub get failed.' }

      - name: Analyze source
        shell: pwsh
        continue-on-error: true
        run: |
          flutter analyze 2>&1 | Tee-Object analyze_log.txt
          if (Test-Path analyze_log.txt) { Get-Content analyze_log.txt -Tail 120 }

      - name: Clean
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter clean
          if ($LASTEXITCODE -ne 0) { throw 'flutter clean failed.' }
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'flutter pub get after clean failed.' }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'build_windows_log.txt'
          flutter build windows --release --verbose 2>&1 | Tee-Object $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 240 }
            throw "flutter build windows failed with exit code $code"
          }

      - name: Verify Flutter output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build\windows\x64\runner\Release'
          $exe = Join-Path $release 'outbound_database.exe'
          if (-not (Test-Path $exe)) {
            Write-Host 'Expected output was not found.'
            Write-Host 'Searching build directory:'
            Get-ChildItem build\windows -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName,Length
            throw "Executable not found: $exe"
          }
          "RELEASE_DIR=$release" >> $env:GITHUB_ENV
          Write-Host "Found $exe"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item dist -ItemType Directory -Force | Out-Null
          Compress-Archive -Path "$env:RELEASE_DIR\*" -DestinationPath 'dist\OutboundDatabase-Windows-Portable.zip' -Force
          if (-not (Test-Path 'dist\OutboundDatabase-Windows-Portable.zip')) { throw 'Portable ZIP was not created.' }

      - name: Prepare NSIS payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path installer_payload) { Remove-Item installer_payload -Recurse -Force }
          New-Item installer_payload -ItemType Directory -Force | Out-Null
          Copy-Item "$env:RELEASE_DIR\*" installer_payload -Recurse -Force
          if (-not (Test-Path 'installer_payload\outbound_database.exe')) { throw 'Installer payload does not contain outbound_database.exe.' }

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey could not install NSIS.' }
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'),
            (Join-Path $env:ChocolateyInstall 'bin\makensis.exe'),
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\ProgramData\chocolatey\bin\makensis.exe'
          )
          $makensis = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $makensis) {
            Write-Host 'Searching for makensis.exe...'
            Get-ChildItem 'C:\Program Files (x86)\NSIS','C:\Program Files\NSIS','C:\ProgramData\chocolatey' -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
            throw 'NSIS makensis.exe was not found.'
          }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw 'makensis.exe could not be executed.' }
          "MAKENSIS=$makensis" >> $env:GITHUB_ENV

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:MAKENSIS /V3 installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installer build failed.' }
          if (-not (Test-Path 'OutboundDatabase-Setup.exe')) { throw 'Installer was not created.' }

      - name: Create manifest
        if: always()
        shell: pwsh
        run: |
          @"
          Repository: $env:GITHUB_REPOSITORY
          Commit: $env:GITHUB_SHA
          Ref: $env:GITHUB_REF
          Flutter:
          $(flutter --version | Out-String)
          Database: %APPDATA%\OutboundDatabase\outbound_database_v2.db
          "@ | Set-Content build_manifest.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outbound-database-windows
          if-no-files-found: warn
          path: |
            dist/OutboundDatabase-Windows-Portable.zip
            OutboundDatabase-Setup.exe
            build_windows_log.txt
            analyze_log.txt
            build_manifest.txt

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/OutboundDatabase-Windows-Portable.zip
            OutboundDatabase-Setup.exe
