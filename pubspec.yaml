name: outbound_database
description: "Outbound Database — Windows-only Flutter app to parse .docx dispatchs and store deduped clients and items."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^0.10.0
  archive: ^3.3.2
  xml: ^6.1.0
  sqflite_common_ffi: ^2.2.2
  path: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
