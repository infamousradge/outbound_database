name: outbound_database
description: "Outbound Database — Windows Flutter app to parse .docx dispatches and store deduplicated clients and items."
version: 0.1.0+1
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  archive: ^4.0.9
  xml: ^6.6.1
  sqflite_common_ffi: ">=2.3.7 <2.4.0"
  sqlite3: ^2.9.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
